colorScheme = "not-a-chef"
defaultAppearance = "light"
autoSwitchAppearance = true

# Default Open Graph / Twitter image for every page (head.html). Source
# and regeneration command: tools/social-card.html.
defaultSocialImage = "img/social-card.png"

enableSearch = true
enableCodeCopy = false
mainSections = ["recipes"]

[header]
  # "basic" resolves straight to header/basic.html with no wrapper — our
  # override of that partial is a normal static nav bar (mockups/STYLE.md),
  # not the floating/blurred chrome the other header/*.html layouts add.
  layout = "basic"

[footer]
  showMenu = true
  showCopyright = true
  showThemeAttribution = false
  # NB: despite the [footer] section, this actually controls an icon-only
  # toggle in the *header* nav (see themes/blowfish/layouts/partials/header/
  # components/{desktop,mobile}-menu.html) — Blowfish's footer.html never
  # reads it. Disabled: our theme toggle lives in the footer instead
  # (layouts/partials/footer.html), per mockups/STYLE.md's Decisions.
  showAppearanceSwitcher = false
  showScrollToTop = true

[homepage]
  layout = "background"
  showRecent = true
  showRecentItems = 6
  showMoreLink = true
  showMoreLinkDest = "recipes"
  cardView = true
  layoutBackgroundBlur = true

[article]
  showDate = false
  showAuthor = false
  showHero = false
  showBreadcrumbs = true
  showDraftLabel = true
  showEdit = false
  showHeadingAnchors = true
  showPagination = true
  showReadingTime = false
  showTableOfContents = true
  showRelatedContent = true
  relatedContentLimit = 6
  showTaxonomies = true
  showWordCount = false
  sharingLinks = []

[recipe]
  # Kelvin is a real option in the units-conversion engine
  # (themes/fugu/assets/js/ingredients.js) but it's more of a joke than something
  # anyone cooking from this site actually wants — off by default, and a
  # config flag (not a code change) if that ever stops being true.
  enableKelvin = false

[list]
  showHero = false
  showBreadcrumbs = true
  showSummary = true
  showTableOfContents = false
  showCards = true
  groupByYear = false
  cardView = true

[taxonomy]
  showTermCount = true
  showHero = false
  showBreadcrumbs = true
  cardView = true

[term]
  showHero = false
  showBreadcrumbs = true
  groupByYear = false
  cardView = true

[author]
  # Feeds <meta name="author"> and the JSON-LD author. Not shown on pages:
  # article.showAuthor is off, and the homepage is a custom layout.
  name = "Bruce Alderson"

[fugu]
  # Fugu's basic styles off: custom.css styles every class Fugu emits.
  styles = false

  # Recipe sidebar boxes, top to bottom (Fugu's default puts notes last).
  recipeSidebar = ["photos", "to-serve", "mechanic", "notes", "variations", "equipment"]

  # Methods are their own top-level section, content/methods/, whose page
  # (/methods/) is the methods list (docs/METHODS.md).
  methodSection = "methods"

  # Drinks are recipes in their own top-level section, content/drinks/:
  # recipe pages, a drinks list, and entries in public/recipes/index.json.
  drinkSection = "drinks"

  # Reference essays (full definitions: Win the fridge, Test kitchen) live
  # under Reference, so wiki links to them get the glossary popover and a
  # principle tag finds its essay there. A subfolder, not "reference" itself,
  # or every reference page would become a popover target.
  referenceEssays = "reference/essays"

  # Drafts are published as "Test kitchen" recipes: a banner under the
  # title and tags, and a mark on the card. What each key changes, and how
  # to turn it off: docs/DESIGN.md "Test kitchen (drafts)". Fugu's own words
  # are "In development" / canon.
  [fugu.development]
    label   = "Test kitchen"
    short   = "Testing"
    message = "We're still testing this one. Cook it, change it, and expect it to move before it becomes a keeper."
    note    = "Working on"
    page    = "reference/essays/test-kitchen"
    more    = "How the test kitchen works"
    heading = "In the test kitchen now"
    empty   = "Nothing is in the test kitchen right now."
    icon    = "icons/development/pot-steam.svg"
