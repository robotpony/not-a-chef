colorScheme = "not-a-chef"
defaultAppearance = "light"
autoSwitchAppearance = true

enableSearch = true
enableCodeCopy = false
mainSections = ["recipes"]

[header]
  # "basic" resolves straight to header/basic.html with no wrapper — our
  # override of that partial is a normal static nav bar (mockups/STYLE.md),
  # not the floating/blurred chrome the other header/*.html layouts add.
  layout = "basic"

[footer]
  showMenu = true
  showCopyright = true
  showThemeAttribution = false
  # NB: despite the [footer] section, this actually controls an icon-only
  # toggle in the *header* nav (see themes/blowfish/layouts/partials/header/
  # components/{desktop,mobile}-menu.html) — Blowfish's footer.html never
  # reads it. Disabled: our theme toggle lives in the footer instead
  # (layouts/partials/footer.html), per mockups/STYLE.md's Decisions.
  showAppearanceSwitcher = false
  showScrollToTop = true

[homepage]
  layout = "background"
  showRecent = true
  showRecentItems = 6
  showMoreLink = true
  showMoreLinkDest = "recipes"
  cardView = true
  layoutBackgroundBlur = true

[article]
  showDate = false
  showAuthor = false
  showHero = false
  showBreadcrumbs = true
  showDraftLabel = true
  showEdit = false
  showHeadingAnchors = true
  showPagination = true
  showReadingTime = false
  showTableOfContents = true
  showRelatedContent = true
  relatedContentLimit = 6
  showTaxonomies = true
  showWordCount = false
  sharingLinks = []

[recipe]
  # Kelvin is a real option in the units-conversion engine
  # (assets/js/ingredients.js) but it's more of a joke than something
  # anyone cooking from this site actually wants — off by default, and a
  # config flag (not a code change) if that ever stops being true.
  enableKelvin = false

[readingSidebar]
  # Recipe tags shown as "Cook tonight" pills in the sidebar on essay,
  # reference, Food Log, and About pages (layouts/partials/reading-sidebar.html).
  cookTonight = ["quick", "make-ahead", "vegetarian", "weeknight"]

[list]
  showHero = false
  showBreadcrumbs = true
  showSummary = true
  showTableOfContents = false
  showCards = true
  groupByYear = false
  cardView = true

[taxonomy]
  showTermCount = true
  showHero = false
  showBreadcrumbs = true
  cardView = true

[term]
  showHero = false
  showBreadcrumbs = true
  groupByYear = false
  cardView = true
