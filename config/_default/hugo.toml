theme = ["fugu", "blowfish"]
baseURL = "https://bruce-loves-to-cook.warpedvisions.org/"
defaultContentLanguage = "en"
enableRobotsTXT = true
summaryLength = 30
# Drafts are published as Test kitchen recipes (params.toml [fugu.development]).
buildDrafts = true
buildFuture = false
enableEmoji = true
# Page .Lastmod comes from each file's last git commit; the sidebars show
# it as "Updated" (themes/fugu/layouts/partials/sidebar/date-rows.html).
enableGitInfo = true
# ALL-CAPS markdown files (IDEAS.md, TODO.md, ...) are working notes that sit
# beside the content they're about; never publish them.
ignoreFiles = ['/[A-Z][A-Z0-9_-]*\.md$']

[pagination]
  pagerSize = 12

[taxonomies]
  tag = "tags"
  cuisine = "cuisine"
  # Blueprints: dish types made of parts, for methods (docs/METHODS.md).
  blueprint = "blueprint"

# Newest items per feed (every feed, not only the site one). Without it the
# site feed carried all ~290 pages, so a new subscriber got the whole archive.
[services.rss]
  limit = 50

[outputs]
  home = ["HTML", "RSS", "JSON"]

[related]
  threshold = 50
  toLower = true
  [[related.indices]]
    name = "tags"
    weight = 100
  [[related.indices]]
    name = "cuisine"
    weight = 80
  [[related.indices]]
    name = "date"
    weight = 10

# static/images is also mounted as assets/images so the image render hook
# (themes/fugu/layouts/_default/_markup/render-image.html) can resize photos into
# thumbnails. Declaring any assets mount replaces Hugo's default one, so
# the plain assets/ mount is restated first.
[module]
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "static/images"
    target = "assets/images"
