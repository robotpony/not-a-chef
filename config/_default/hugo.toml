theme = "blowfish"
baseURL = "https://bruce-loves-to-cook.warpedvisions.org/"
defaultContentLanguage = "en"
enableRobotsTXT = true
summaryLength = 30
buildDrafts = false
buildFuture = false
enableEmoji = true
# Page .Lastmod comes from each file's last git commit; the sidebars show
# it as "Updated" (layouts/partials/sidebar/date-rows.html).
enableGitInfo = true

[pagination]
  pagerSize = 12

[taxonomies]
  tag = "tags"
  cuisine = "cuisine"

[outputs]
  home = ["HTML", "RSS", "JSON"]

[related]
  threshold = 50
  toLower = true
  [[related.indices]]
    name = "tags"
    weight = 100
  [[related.indices]]
    name = "cuisine"
    weight = 80
  [[related.indices]]
    name = "date"
    weight = 10
